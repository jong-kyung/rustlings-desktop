name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          version: 0.2.4
          node-version: "24"
          cache: true
          run-install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Install Cargo Shear
        run: cargo install cargo-shear --version 1.13.2 --locked

      - name: Check frontend
        run: vp check

      - name: Check unused Rust dependencies
        run: cargo shear --locked
        working-directory: src-tauri

      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Test Rust
        run: cargo test --locked
        working-directory: src-tauri

      - name: Build Tauri smoke test
        run: vp exec tauri build --debug --no-bundle --ci -- --locked
